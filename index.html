<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fd1">
  <title>Família Próspera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sora:wght@600;700&display=swap">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="auth-root" aria-live="polite"></div>
<div id="app-shell" hidden>
<div class="page">
  <header class="top">
    <div class="brand"><i>F</i>Família Próspera</div>
    <div class="top-actions">
      <button class="btn sm" data-a="startGuide">Aprender a usar</button>
      <button class="btn sm" id="btn-eye" aria-label="Esconder ou mostrar valores"></button>
      <button class="btn sm" data-a="logout">Sair</button>
    </div>
  </header>
  <p class="hint signed-in-as">Conta: <b id="user-email"></b></p>
  <div id="banner"></div>
  <h1 id="title">Início</h1>
  <main id="view" aria-live="polite" style="display:flex;flex-direction:column;gap:1rem"></main>
</div>
<nav class="tabbar" aria-label="Principal"><div id="tabs"></div></nav>
<div id="modalroot"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="guide-root"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="./app.js" defer></script>
</body>
</html>
